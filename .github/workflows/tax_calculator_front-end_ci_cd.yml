name: Tax Calculator Frontend App To AWS EKS
on:
  # push
  workflow_dispatch:
    # matrix pour eviter la duplication de code(2jobs) dans les workflows
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: create .env file for docker build
        working-directory: docker/app2-tax-calculator/frontend
        run: echo "VITE_API_URL=/api" > .env 

      - name: setup Node.js
        uses: actions/setup-node@v6
          with:
            node-version: 25

      - name: Install dependencies
        working-directory: docker/app2-tax-calculator/frontend
        run: npm ci
      
      - name: Run tests (If any)
        working-directory: docker/app2-tax-calculator/frontend
        run: npm test --if-present

      - name: Build frontend
        working-directory: docker/app2-tax-calculator/frontend
        run: npm run build

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login To DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: create .env file for docker build
        working-directory: docker/app2-tax-calculator/frontend
        run: echo "VITE_API_URL=/api" > .env

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: docker/app2-tax-calculator/frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tax-calculator-frontend:latest

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for AWS EKS
        run: |
          aws eks update-kubeconfig --name hello-cluster --region us-east-1 
      
      - name: Verify connection to EKS cluster
        run: kubectl get nodes
      
      - name: Deploy to AWS EKS (kubernetes)
        run: |
          kubectl apply -f k8s/aws/app2-tax-calculator/frontend.yaml
          kubectl apply -f k8s/aws/app2-tax-calculator/ingress.yaml