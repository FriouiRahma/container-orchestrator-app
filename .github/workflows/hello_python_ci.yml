name: Hello Python App To Docker
on:
  push:
    paths:
      - "docker/app1-hello/python"
    branches:
      - main
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v6
        with:
            python-version: '3.13'
    
      - name: Install dependencies
        working-directory: ./docker/app1-hello/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      - name: Run smoke test
        working-directory: ./docker/app1-hello/python
        run: python -m py_compile  main.py

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login To DockerHub
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
            context: ./docker/app1-hello/python
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/hello-python:latest
              ${{ secrets.DOCKER_USERNAME }}/hello-python:${{ github.sha }}
              ${{ secrets.DOCKER_USERNAME }}/hello-python:${{ github.ref_name}}