name: Hello Node App To Docker
on:
  push:
    paths:
      - "docker/app1-hello/node"
  workflow_dispatch:
jobs:   
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Install dependencies
        working-directory: docker/app1-hello/node
        run: npm ci

      - name: Run tests (If any)
        working-directory: docker/app1-hello/node
        run: npm test --if-present

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login To DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/app1-hello/node
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-node:latest
            ${{ secrets.DOCKER_USERNAME }}/hello-node:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/hello-node:${{ github.ref_name }}
 docker-build-push:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: checkout code
        uses: actions/checkout@v4

     - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

     - name: Set up kubectl
        uses: azure/setup-kubectl@v4
    
    - name: Update kubeconfig for AWS EKS
      run: |
        aws eks update-kubeconfig --name hello-cluster --region us-east-1 
    
    - name: verify connection to cluster
      run: kubectl get nodes
    
    - name: Deploy to AWS EKS
      run: kubectl apply -f k8s/aws/app1-hello/helloapp.yaml