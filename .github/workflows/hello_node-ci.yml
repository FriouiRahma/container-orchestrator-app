name: node pipeline ci
on:
  push:
    paths:
      - "docker/app1-hello/nodejs/node"
  workflow_dispatch:
jobs:   
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
            node-version: 25

      - name: Install dependencies
        working-directory: docker/app1-hello/nodejs/node
        run: npm ci

      - name: Run tests (If any)
        working-directory: docker/app1-hello/nodejs/node
        run: npm test --if-present

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Login To DockerHub
      uses: docker/login-action@v4
      with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and Push Docker Image 
      uses: docker/build-push-action@v7
      with:
        context: ./docker/app1-hello/nodejs/node
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/hello-node:latest
          ${{ secrets.DOCKER_USERNAME }}/hello-node:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/hello-node:${{ github.ref_name}}
        
