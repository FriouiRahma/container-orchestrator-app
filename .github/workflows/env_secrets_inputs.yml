name: Demo Env Secrets
on:
  push:
    branches:
      - main
#  workflow_dispatch:
# workflow Level Env
env: 
  GLOBAL_APP_ENV: global-dev
jobs:
  build:
    runs-on: ubuntu-latest
# Job Level Env
    env:
      JOB_APP_ENV: job-dev
    steps:
      - name: Run a one-line script
        run: echo "Hello, World!"

      - name: Install
# Step Level Env
        env: 
          APP_ENV: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment $APP_ENV,  $GLOBAL_APP_ENV,  using $DB_PASSWORD, $JOB_APP_ENV"
      - name: Create Demo
        run: |
            echo "Hello from CI pipeline! >" demo.txt
            echo "File created Successfully."
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-artifact
          path: .